<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176f70">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="人生OS">
  <title>人生OS 週次レビュー</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="app-shell">
    <header class="hero card">
      <p class="eyebrow">Life Operating System</p>
      <h1>人生OS 週次レビュー</h1>
      <p class="subtitle">業務標準化・家族・健康・資産・英語を、毎週1ページで統合管理するアプリです。</p>
    </header>

    <section class="dashboard card">
      <h2>今月ダッシュボード</h2>
      <div id="dashboardCards" class="card-grid"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>週次レビュー入力</h2>
        <button id="resetFormButton" class="btn btn-ghost" type="button">新規入力に戻す</button>
      </div>

      <form id="weeklyForm" novalidate>
        <input id="reviewId" name="reviewId" type="hidden">

        <div class="grid two">
          <label>
            週開始日
            <input id="weekStart" name="weekStart" type="date" required>
          </label>
          <label>
            週終了日
            <input id="weekEnd" name="weekEnd" type="date" required>
          </label>
        </div>

        <fieldset>
          <legend>今週の最重要3タスク</legend>
          <div class="grid one">
            <label>タスク1 <input id="task1" name="task1" type="text"></label>
            <label>タスク2 <input id="task2" name="task2" type="text"></label>
            <label>タスク3 <input id="task3" name="task3" type="text"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>実行結果</legend>
          <div class="grid three">
            <label>
              達成数（/3）
              <input id="achievedCount" name="achievedCount" type="number" min="0" max="3" step="1">
            </label>
            <label class="wide-2">
              達成できた理由
              <input id="achievedReason" name="achievedReason" type="text">
            </label>
          </div>
          <label>
            未達の原因
            <input id="missedReason" name="missedReason" type="text">
          </label>
        </fieldset>

        <fieldset>
          <legend>KPI</legend>
          <div class="grid three">
            <label>業務標準化件数 <input id="standardizationCount" name="standardizationCount" type="number" min="0" step="1"></label>
            <label>家族時間（h/週） <input id="familyHours" name="familyHours" type="number" min="0" step="0.5"></label>
            <label>睡眠平均（h/日） <input id="sleepAvg" name="sleepAvg" type="number" min="0" step="0.1"></label>
            <label>体重（kg） <input id="weight" name="weight" type="number" min="0" step="0.1"></label>
            <label>
              資産確認
              <select id="assetCheck" name="assetCheck">
                <option value="">未選択</option>
                <option value="実施">実施</option>
                <option value="未実施">未実施</option>
              </select>
            </label>
            <label>英語学習日数 <input id="englishDays" name="englishDays" type="number" min="0" max="7" step="1"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>週の採点（100点満点）</legend>
          <div class="grid four">
            <label>仕事 <input id="scoreWork" name="scoreWork" type="number" min="0" max="100" step="1"></label>
            <label>生活 <input id="scoreLife" name="scoreLife" type="number" min="0" max="100" step="1"></label>
            <label>継続力 <input id="scoreConsistency" name="scoreConsistency" type="number" min="0" max="100" step="1"></label>
            <label>総合点 <input id="scoreTotal" name="scoreTotal" type="number" min="0" max="100" step="1"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>振り返り</legend>
          <div class="grid one">
            <label>良かったこと1 <input id="good1" name="good1" type="text"></label>
            <label>良かったこと2 <input id="good2" name="good2" type="text"></label>
            <label>良かったこと3 <input id="good3" name="good3" type="text"></label>
            <label>改善1つ <input id="improvement" name="improvement" type="text"></label>
            <label>来週の布石（5分行動） <input id="seedAction" name="seedAction" type="text"></label>
          </div>
        </fieldset>

        <div class="actions">
          <button class="btn" type="submit">保存する</button>
          <button id="clearButton" class="btn btn-ghost" type="button">入力をクリア</button>
          <button id="fillSampleButton" class="btn btn-ghost" type="button">サンプルを入れる</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>保存済みレビュー</h2>
        <button id="exportButton" class="btn btn-ghost" type="button">JSONエクスポート</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>対象週</th>
              <th>達成</th>
              <th>標準化</th>
              <th>英語</th>
              <th>総合点</th>
              <th>資産確認</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>月末サマリー</h2>
        <label class="month-picker">
          対象月
          <input id="summaryMonth" type="month">
        </label>
      </div>
      <div id="summaryOutput" class="summary-box"></div>
    </section>

    <section class="card">
      <h2>ChatGPT連携</h2>
      <p class="small">保存データをもとに分析依頼文を自動生成します。</p>
      <div class="actions">
        <button id="copyWeeklyPromptButton" class="btn btn-ghost" type="button">週次分析プロンプトをコピー</button>
        <button id="copyMonthlyPromptButton" class="btn btn-ghost" type="button">月末分析プロンプトをコピー</button>
      </div>
      <pre id="promptPreview" class="prompt-preview">ここに生成プレビューが表示されます。</pre>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
